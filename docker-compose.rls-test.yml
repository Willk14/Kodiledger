services:
  postgres-rls-test:
    image: postgres:15-alpine
    container_name: kodiflow_rls_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RLS_TEST_POSTGRES_PASSWORD:?Set RLS_TEST_POSTGRES_PASSWORD in .env.rls-test}
      POSTGRES_DB: kodiflow_db
    ports:
      - "127.0.0.1:${RLS_TEST_PORT:-5435}:5432"
    volumes:
      - kodiflow_rls_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kodiflow_db"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  kodiflow_rls_test_data:

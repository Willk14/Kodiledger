services:

  postgres:

    image: postgres:15-alpine

    container_name: kodiflow_db

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgrespassword

      POSTGRES_DB: kodiflow_db

    ports:

      - "5434:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7-alpine

    container_name: kodiflow_redis

    ports:

      - "6379:6379"

volumes:

  postgres_data:
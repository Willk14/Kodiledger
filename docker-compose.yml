services:

  postgres:
    image: postgres:15-alpine
    container_name: kodiflow_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kodiflow_db

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kodiflow_redis

    ports:
      - "6379:6379"

    restart: unless-stopped

volumes:
  postgres_data:
